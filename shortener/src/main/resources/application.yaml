server:
  http2:
    enabled: true
spring:
  application:
    name: reactive-url-shortener
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/shortener
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    pool:
      initial-size: 20
      max-size: 50
      max-idle-time: 1m
      validation-query: "SELECT 1"
      validation-depth: REMOTE
      acquire-retry: 3
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/shortener
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    persist-authorization: true
    display-request-duration: true
    oauth:
      client-id: shortener-client
      realm: shortener
      app-name: "Url Shortener API"
      use-pkce-with-authorization-code-grant: true
app:
  short-link-base: http://localhost:8080
