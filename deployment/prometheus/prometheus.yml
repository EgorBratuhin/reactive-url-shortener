global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'shortener-app'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - 'shortener:8081'
        labels:
          application: 'reactive-url-shortener'

  - job_name: 'keycloak'
    metrics_path: /metrics
    static_configs:
      - targets:
          - 'keycloak:9000'
        labels:
          application: 'keycloak'
          namespace: 'keycloak'
          container: 'keycloak'
    relabel_configs:
      - source_labels: [__address__]
        target_label: pod
